resourceMetrics:
  - resource:
      attributes:
        - key: service.instance.id
          value:
            stringValue: localhost:5432
    scopeMetrics:
      - metrics:
          - description: Number of buffers allocated.
            name: postgresql.bgwriter.buffers.allocated
            sum:
              aggregationTemporality: 2
              dataPoints:
                - asInt: "594"
                  startTimeUnixNano: "1000000"
                  timeUnixNano: "2000000"
              isMonotonic: true
            unit: '{buffers}'
          - description: Number of buffers written.
            name: postgresql.bgwriter.buffers.writes
            sum:
              aggregationTemporality: 2
              dataPoints:
                - asInt: "14"
                  attributes:
                    - key: source
                      value:
                        stringValue: backend
                  startTimeUnixNano: "1000000"
                  timeUnixNano: "2000000"
                - asInt: "0"
                  attributes:
                    - key: source
                      value:
                        stringValue: backend_fsync
                  startTimeUnixNano: "1000000"
                  timeUnixNano: "2000000"
                - asInt: "0"
                  attributes:
                    - key: source
                      value:
                        stringValue: bgwriter
                  startTimeUnixNano: "1000000"
                  timeUnixNano: "2000000"
                - asInt: "67"
                  attributes:
                    - key: source
                      value:
                        stringValue: checkpoints
                  startTimeUnixNano: "1000000"
                  timeUnixNano: "2000000"
              isMonotonic: true
            unit: '{buffers}'
          - description: The number of checkpoints performed.
            name: postgresql.bgwriter.checkpoint.count
            sum:
              aggregationTemporality: 2
              dataPoints:
                - asInt: "4"
                  attributes:
                    - key: type
                      value:
                        stringValue: requested
                  startTimeUnixNano: "1000000"
                  timeUnixNano: "2000000"
                - asInt: "0"
                  attributes:
                    - key: type
                      value:
                        stringValue: scheduled
                  startTimeUnixNano: "1000000"
                  timeUnixNano: "2000000"
              isMonotonic: true
            unit: '{checkpoints}'
          - description: Total time spent writing and syncing files to disk by checkpoints.
            name: postgresql.bgwriter.duration
            sum:
              aggregationTemporality: 2
              dataPoints:
                - asDouble: 84
                  attributes:
                    - key: type
                      value:
                        stringValue: sync
                  startTimeUnixNano: "1000000"
                  timeUnixNano: "2000000"
                - asDouble: 25
                  attributes:
                    - key: type
                      value:
                        stringValue: write
                  startTimeUnixNano: "1000000"
                  timeUnixNano: "2000000"
              isMonotonic: true
            unit: ms
          - description: Number of times the background writer stopped a cleaning scan because it had written too many buffers.
            name: postgresql.bgwriter.maxwritten
            sum:
              aggregationTemporality: 2
              dataPoints:
                - asInt: "0"
                  startTimeUnixNano: "1000000"
                  timeUnixNano: "2000000"
              isMonotonic: true
            unit: "1"
          - description: The number of disk block hits in the buffer cache, thereby avoiding database reads, tagged with database name.
            gauge:
              dataPoints:
                - asInt: "3601"
                  attributes:
                    - key: dbname
                      value:
                        stringValue: otel
                  startTimeUnixNano: "1000000"
                  timeUnixNano: "2000000"
            name: postgresql.buffer_hit
            unit: '{hit}/s'
          - description: Configured maximum number of client connections allowed
            gauge:
              dataPoints:
                - asInt: "100"
                  startTimeUnixNano: "1000000"
                  timeUnixNano: "2000000"
            name: postgresql.connection.max
            unit: '{connection}'
          - description: Number of user databases.
            name: postgresql.database.count
            sum:
              aggregationTemporality: 2
              dataPoints:
                - asInt: "1"
                  startTimeUnixNano: "1000000"
                  timeUnixNano: "2000000"
            unit: '{databases}'
          - description: Max duration of active transactions.
            gauge:
              dataPoints:
                - asDouble: 0
                  startTimeUnixNano: "1000000"
                  timeUnixNano: "2000000"
            name: postgresql.transactions.duration.max
            unit: ms
          - description: Sum of duration of active transactions.
            gauge:
              dataPoints:
                - asDouble: 0
                  startTimeUnixNano: "1000000"
                  timeUnixNano: "2000000"
            name: postgresql.transactions.duration.sum
            unit: ms
          - description: Number of WAL files.
            gauge:
              dataPoints:
                - asInt: "1"
                  startTimeUnixNano: "1000000"
                  timeUnixNano: "2000000"
            name: postgresql.wal.count
            unit: "1"
          - description: Total size of WAL files.
            gauge:
              dataPoints:
                - asInt: "16777216"
                  startTimeUnixNano: "1000000"
                  timeUnixNano: "2000000"
            name: postgresql.wal.size
            unit: By
        scope:
          name: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/postgresqlreceiver
          version: latest
  - resource:
      attributes:
        - key: postgresql.database.name
          value:
            stringValue: otel
        - key: service.instance.id
          value:
            stringValue: localhost:5432
    scopeMetrics:
      - metrics:
          - description: The number of backends.
            name: postgresql.backends
            sum:
              aggregationTemporality: 2
              dataPoints:
                - asInt: "1"
                  startTimeUnixNano: "1000000"
                  timeUnixNano: "2000000"
            unit: "1"
          - description: Number of times disk blocks were found already in the buffer cache.
            name: postgresql.blks_hit
            sum:
              aggregationTemporality: 2
              dataPoints:
                - asInt: "2330"
                  startTimeUnixNano: "1000000"
                  timeUnixNano: "2000000"
              isMonotonic: true
            unit: '{blks_hit}'
          - description: Number of disk blocks read in this database.
            name: postgresql.blks_read
            sum:
              aggregationTemporality: 2
              dataPoints:
                - asInt: "190"
                  startTimeUnixNano: "1000000"
                  timeUnixNano: "2000000"
              isMonotonic: true
            unit: '{blks_read}'
          - description: The number of commits.
            name: postgresql.commits
            sum:
              aggregationTemporality: 2
              dataPoints:
                - asInt: "7"
                  startTimeUnixNano: "1000000"
                  timeUnixNano: "2000000"
              isMonotonic: true
            unit: "1"
          - description: The database disk usage.
            name: postgresql.db_size
            sum:
              aggregationTemporality: 2
              dataPoints:
                - asInt: "8028675"
                  startTimeUnixNano: "1000000"
                  timeUnixNano: "2000000"
            unit: By
          - description: The number of deadlocks.
            name: postgresql.deadlocks
            sum:
              aggregationTemporality: 2
              dataPoints:
                - asInt: "0"
                  startTimeUnixNano: "1000000"
                  timeUnixNano: "2000000"
              isMonotonic: true
            unit: '{deadlock}'
          - description: The number of rollbacks.
            name: postgresql.rollbacks
            sum:
              aggregationTemporality: 2
              dataPoints:
                - asInt: "0"
                  startTimeUnixNano: "1000000"
                  timeUnixNano: "2000000"
              isMonotonic: true
            unit: "1"
          - description: Number of user tables in a database.
            name: postgresql.table.count
            sum:
              aggregationTemporality: 2
              dataPoints:
                - asInt: "2"
                  startTimeUnixNano: "1000000"
                  timeUnixNano: "2000000"
            unit: '{table}'
          - description: Total amount of data written to temporary files by queries.
            name: postgresql.temp.io
            sum:
              aggregationTemporality: 2
              dataPoints:
                - asInt: "0"
                  startTimeUnixNano: "1000000"
                  timeUnixNano: "2000000"
              isMonotonic: true
            unit: By
          - description: The number of temp files.
            name: postgresql.temp_files
            sum:
              aggregationTemporality: 2
              dataPoints:
                - asInt: "0"
                  startTimeUnixNano: "1000000"
                  timeUnixNano: "2000000"
              isMonotonic: true
            unit: '{temp_file}'
          - description: Number of rows deleted by queries in the database.
            name: postgresql.tup_deleted
            sum:
              aggregationTemporality: 2
              dataPoints:
                - asInt: "0"
                  startTimeUnixNano: "1000000"
                  timeUnixNano: "2000000"
              isMonotonic: true
            unit: '{tup_deleted}'
          - description: Number of rows fetched by queries in the database.
            name: postgresql.tup_fetched
            sum:
              aggregationTemporality: 2
              dataPoints:
                - asInt: "1014"
                  startTimeUnixNano: "1000000"
                  timeUnixNano: "2000000"
              isMonotonic: true
            unit: '{tup_fetched}'
          - description: Number of rows inserted by queries in the database.
            name: postgresql.tup_inserted
            sum:
              aggregationTemporality: 2
              dataPoints:
                - asInt: "74"
                  startTimeUnixNano: "1000000"
                  timeUnixNano: "2000000"
              isMonotonic: true
            unit: '{tup_inserted}'
          - description: Number of rows returned by queries in the database.
            name: postgresql.tup_returned
            sum:
              aggregationTemporality: 2
              dataPoints:
                - asInt: "1097"
                  startTimeUnixNano: "1000000"
                  timeUnixNano: "2000000"
              isMonotonic: true
            unit: '{tup_returned}'
          - description: Number of rows updated by queries in the database.
            name: postgresql.tup_updated
            sum:
              aggregationTemporality: 2
              dataPoints:
                - asInt: "5"
                  startTimeUnixNano: "1000000"
                  timeUnixNano: "2000000"
              isMonotonic: true
            unit: '{tup_updated}'
        scope:
          name: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/postgresqlreceiver
          version: latest
