# Use this changelog template to create an entry for release notes.

# One of 'breaking', 'deprecation', 'new_component', 'enhancement', 'bug_fix'
change_type: bug_fix

# The name of the component, or a single word describing the area of concern, (e.g. receiver/filelog)
component: receiver/postgresql

# A brief description of the change.  Surround your text with quotes ("") if it needs to start with a backtick (`).
note: Collect top queries on PostgreSQL 17, and gate pg_stat_statements columns on the extension version

# Mandatory: One or more tracking issues related to the change. You can use the PR number here if no issue exists.
issues: [45190]

# (Optional) One or more lines of additional information to render under the primary note.
# These lines will be padded with 2 spaces and then inserted directly into the document.
# Use pipe (|) for multiline entries.
subtext: |
  Top query collection failed on every PostgreSQL 17 server with a current extension, with
  `pq: column "blk_read_time" does not exist`. pg_stat_statements 1.11, which CREATE EXTENSION
  installs on PostgreSQL 17, renamed `blk_read_time` and `blk_write_time` to
  `shared_blk_read_time` and `shared_blk_write_time`. The receiver now selects the names the
  installed extension actually has and aliases them to the existing attribute names, so the
  emitted attributes are unchanged.

  Column availability is now derived from the extension version read from `pg_extension`, rather
  than from the server's major version. The two can disagree: pg_upgrade does not update extension
  versions, so a PostgreSQL 14 or newer server can still be running pg_stat_statements 1.8, which
  has no `toplevel` column. Gating on the server version there selected a column that does not
  exist and failed the query performance metrics path.

  The view and function are now schema-qualified using the extension's own installation schema, so
  installations that place pg_stat_statements outside the search path (Supabase uses `extensions`)
  work. The lookup runs once per connection rather than on every scrape.

