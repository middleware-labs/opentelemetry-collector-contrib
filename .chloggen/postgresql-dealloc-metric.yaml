# Use this changelog template to create an entry for release notes.

# One of 'breaking', 'deprecation', 'new_component', 'enhancement', 'bug_fix'
change_type: enhancement

# The name of the component, or a single word describing the area of concern, (e.g. filelogreceiver)
component: receiver/postgresql

# A brief description of the change.  Surround your text with quotes ("") if it needs to start with a backtick (`).
note: Add `postgresql.query.deallocations`, an opt-in counter of pg_stat_statements entries discarded because `pg_stat_statements.max` was exceeded

# Mandatory: One or more tracking issues related to the change. You can use the PR number here if no issue exists.
issues: [45190]

# (Optional) One or more lines of additional information to render under the primary note.
# These lines will be padded with 2 spaces and then inserted directly into the document.
# Use pipe (|) for multiline entries.
subtext: |
  The receiver's top-query events and query-performance metrics can only describe statements that
  pg_stat_statements still holds. When the extension observes more distinct statements than
  `pg_stat_statements.max` allows, it discards the least-executed entries and counts each such
  deallocation in `pg_stat_statements_info.dealloc` (extension 1.9, PostgreSQL 14, and later). A
  rising value means the statement table is too small for the workload and query telemetry is
  losing statements; it is the only server-side signal of that.
  The metric is disabled by default. When enabled it is read once per scrape on the maintenance
  connection, schema-qualified, and skipped without a query on extensions older than 1.9.
  The receiver's factory now also calls the generator's `NewDefaultMetricsBuilderConfig` instead of
  the deprecated wrapper; behavior is identical.

