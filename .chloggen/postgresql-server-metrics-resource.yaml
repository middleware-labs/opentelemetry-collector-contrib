# Use this changelog template to create an entry for release notes.

# One of 'breaking', 'deprecation', 'new_component', 'enhancement', 'bug_fix'
change_type: bug_fix

# The name of the component, or a single word describing the area of concern, (e.g. filelogreceiver)
component: receiver/postgresql

# A brief description of the change.  Surround your text with quotes ("") if it needs to start with a backtick (`).
note: Attribute server-wide metrics to the server resource instead of an arbitrary database's resource

# Mandatory: One or more tracking issues related to the change. You can use the PR number here if no issue exists.
issues: [45190]

# (Optional) One or more lines of additional information to render under the primary note.
# These lines will be padded with 2 spaces and then inserted directly into the document.
# Use pipe (|) for multiline entries.
subtext: |
  `postgresql.database.count`, `postgresql.connection.max`, `postgresql.wal.age`, the
  `postgresql.bgwriter.*` family and the replication lag metrics describe the server, not a database.
  They were recorded before `postgresql.connection.count` emitted its per-database resources, and the
  metrics builder flushes every pending data point into the next resource it emits, so those server-wide
  points landed on whichever database's connection resource came first out of a map iteration. The
  database they were attributed to could therefore change from one scrape to the next.
  Active connections are now collected before the server-wide families, so the server-wide metrics
  reach the resource that carries no `postgresql.database.name`, which is where the receiver's original
  fixtures placed them before `postgresql.connection.count` was added. Connection resources are also
  emitted in a fixed order.
  Behavior change: consumers that grouped these server-wide metrics by `postgresql.database.name` will
  see them without that attribute from now on; they never had a stable value for it.

