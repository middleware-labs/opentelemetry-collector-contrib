# Use this changelog template to create an entry for release notes.

# One of 'breaking', 'deprecation', 'new_component', 'enhancement', 'bug_fix'
change_type: bug_fix

# The name of the component, or a single word describing the area of concern, (e.g. receiver/filelog)
component: receiver/postgresql

# A brief description of the change.  Surround your text with quotes ("") if it needs to start with a backtick (`).
note: Resolve query text when pg_stat_statements lives outside search_path

# Mandatory: One or more tracking issues related to the change. You can use the PR number here if no issue exists.
issues: [45190]

# (Optional) One or more lines of additional information to render under the primary note.
# These lines will be padded with 2 spaces and then inserted directly into the document.
# Use pipe (|) for multiline entries.
subtext: |
  The statement path reads `pg_stat_statements` from three places, and only two of them named the
  view by its schema. Counters and the top-query listing were qualified; the pass that resolves a
  statement's text was not.

  On an installation that keeps the extension out of `search_path` — Supabase installs it into
  `extensions` — the two halves therefore disagreed: counters resolved and text never did. The
  failure is quiet rather than loud, because the text pass is only reached for cache misses and its
  error is not fatal to the scrape; statements simply arrived with no query attached to them.

  The view is now qualified from the same capability lookup its siblings use, so all three reads
  resolve wherever the extension is installed.

