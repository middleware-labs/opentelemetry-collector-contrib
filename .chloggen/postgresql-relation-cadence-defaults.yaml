# Use this changelog template to create an entry for release notes.

# One of 'breaking', 'deprecation', 'new_component', 'enhancement', 'bug_fix'
change_type: breaking

# The name of the component, or a single word describing the area of concern, (e.g. filelogreceiver)
component: receiver/postgresql

# A brief description of the change.  Surround your text with quotes ("") if it needs to start with a backtick (`).
note: Collect per-relation metrics every 60s and bloat metrics every 10m by default

# Mandatory: One or more tracking issues related to the change. You can use the PR number here if no issue exists.
issues: [45190]

# (Optional) One or more lines of additional information to render under the primary note.
# These lines will be padded with 2 spaces and then inserted directly into the document.
# Use pipe (|) for multiline entries.
subtext: |
  `relation_metrics.collection_interval` now defaults to `60s` and `bloat_collection_interval` to
  `10m`. Per-table, per-index and per-function metrics are emitted once a minute and
  `postgresql.table_bloat` and `postgresql.index_bloat` once every ten minutes; database-level and
  server-wide metrics, and `postgresql.table.count`, are still emitted every scrape.
  The receiver's cost is proportional to the number of tables and indexes times the enabled
  per-relation families divided by their interval. On a reference server with 52 databases, 1,464
  tables and 2,720 indexes the defaults reduce allocation and per-database query load by roughly six
  times, and the bloat estimators, the heaviest SQL the receiver issues, run sixty times less often.
  No metric, attribute or resource changes. Cumulative sums keep their start timestamp across the
  gap, so rates computed from them stay correct. The first scrape after start still collects
  everything.
  To restore the previous behavior set `relation_metrics.collection_interval: 0` and
  `bloat_collection_interval: 0`. An interval shorter than `collection_interval` is no longer a
  configuration error; it means every scrape.

