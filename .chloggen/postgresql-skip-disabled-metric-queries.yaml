# Use this changelog template to create an entry for release notes.

# One of 'breaking', 'deprecation', 'new_component', 'enhancement', 'bug_fix'
change_type: enhancement

# The name of the component, or a single word describing the area of concern, (e.g. receiver/filelog)
component: receiver/postgresql

# A brief description of the change.  Surround your text with quotes ("") if it needs to start with a backtick (`).
note: Skip the SQL for metric families that are disabled

# Mandatory: One or more tracking issues related to the change. You can use the PR number here if no issue exists.
issues: [45190]

# (Optional) One or more lines of additional information to render under the primary note.
# These lines will be padded with 2 spaces and then inserted directly into the document.
# Use pipe (|) for multiline entries.
subtext: |
  The receiver issued every query on every scrape regardless of which metrics were enabled, then
  discarded the data points for disabled metrics inside the metrics builder. A disabled family
  still cost its query, its row conversion and a resource per object.

  Each query is now mapped to the metrics that consume its results, and the required set is
  computed once at startup from the existing `metrics:` configuration. No new configuration is
  introduced: the `metrics:` block already expresses the choice, and this change makes the receiver
  honor it at the source. Where every per-database collector is disabled, the scrape no longer
  opens a connection to each database at all.

  Two families are disabled by default and were therefore pure waste out of the box:
  `postgresql.function.calls`, which ran a catalog query and emitted one resource per function
  every scrape, and `postgresql.database.locks`. Both are now skipped unless enabled.

  Deployments that disable families see proportionate savings. Measured on a synthetic scrape of a
  single database (allocations per scrape, which are stable across machines):

  - Default configuration, 1000 tables: 7% fewer allocations, from the two default-off families.
  - Defaults with `postgresql.table_bloat` and `postgresql.index_bloat` disabled: 27% fewer.
  - Server-wide metrics only: 127,454 allocations per scrape down to 66.

  A fully enabled configuration issues exactly the same queries and produces the same output as
  before, and sees no saving. The query-performance and bloat families are enabled by default, so
  most deployments continue to pay for them unless they opt out.

