# Use this changelog template to create an entry for release notes.

# One of 'breaking', 'deprecation', 'new_component', 'enhancement', 'bug_fix'
change_type: enhancement

# The name of the component, or a single word describing the area of concern, (e.g. receiver/filelog)
component: receiver/postgresql

# A brief description of the change.  Surround your text with quotes ("") if it needs to start with a backtick (`).
note: Add per-family collection intervals for relation metrics, bloat metrics and top-query events

# Mandatory: One or more tracking issues related to the change. You can use the PR number here if no issue exists.
issues: [45190]

# (Optional) One or more lines of additional information to render under the primary note.
# These lines will be padded with 2 spaces and then inserted directly into the document.
# Use pipe (|) for multiline entries.
subtext: |
  The cost of a scrape is proportional to the number of tables and indexes on the server times
  the number of enabled per-relation families, divided by the scrape interval. Three new settings
  let the expensive families run less often than the database-level and server-wide metrics,
  which stay on every scrape:

  - `relation_metrics.collection_interval` for per-table, per-index and per-function metrics.
    `postgresql.table.count` is still reported on every scrape.
  - `bloat_collection_interval` for `postgresql.table_bloat` and `postgresql.index_bloat`.
  - `top_query_collection.collection_interval` for top-query events.

  All three are unset by default, which keeps today's behavior and output unchanged. When set,
  each must be at least `collection_interval`. The mechanism is the one schema collection already
  uses: the receiver keeps one scraper per signal and each family keeps its own last-run time.
  Between runs a family issues no SQL and builds no resources; when every per-database family is
  throttled and none is due, no connection is opened to the individual databases on that scrape.

